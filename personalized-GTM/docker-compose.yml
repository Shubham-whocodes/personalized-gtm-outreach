services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-8765}:${PORT:-8765}"
    environment:
      PORT: ${PORT:-8765}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional: set both for HTTPS public access with HTTP Basic auth (demo / DEMO_PASSWORD).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - workspace-data:/data/runs
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  workspace-data:
